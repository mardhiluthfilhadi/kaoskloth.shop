<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - KaosKloth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
            position: relative;
            z-index: 1;
        }

        .header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 50px 40px 30px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            background-size: 200% 100%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
        }

        .header img {
            max-width: 200px;
            width: 100%;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Navbar - Menyatu dengan header */
        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 16px 20px;
            text-decoration: none;
            color: #666;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .nav-item:hover {
            background: rgba(102, 126, 234, 0.05);
            color: #667eea;
        }

        .nav-item.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: rgba(102, 126, 234, 0.08);
        }

        .nav-icon {
            font-size: 18px;
        }

        .gallery-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
            aspect-ratio: 1;
            background: #f0f0f0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .gallery-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item::after {
            content: '🔍';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover::after {
            opacity: 0.9;
        }

        /* Fullscreen Overlay */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .fullscreen-overlay.active {
            display: flex;
        }

        .fullscreen-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .fullscreen-content img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .close-btn:hover {
            background: white;
            transform: rotate(90deg) scale(1.1);
        }

        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-btn:hover {
            background: white;
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn {
            left: 30px;
        }

        .next-btn {
            right: 30px;
        }

        .image-counter {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* Footer */
        .footer {
            background: transparent;
            padding: 40px 20px 30px;
            position: relative;
        }

        .footer-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-content p {
            color: #666;
            font-size: 14px;
            margin: 8px 0;
        }

        .footer-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #ddd, transparent);
            margin: 15px 0;
        }

        /* Theme Toggle */
        .theme-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .theme-toggle-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1);
            background: #e0e0e0;
        }

        .theme-toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* Dark Mode */
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body.dark-mode::before {
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
        }

        body.dark-mode .header,
        body.dark-mode .navbar,
        body.dark-mode .gallery-container {
            background: rgba(30, 30, 46, 0.95);
        }

        body.dark-mode .header h1 {
            background: linear-gradient(135deg, #8b9aff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.dark-mode .subtitle {
            color: #b0b0b0;
        }

        body.dark-mode .nav-item {
            color: #b0b0b0;
        }

        body.dark-mode .nav-item:hover {
            background: rgba(102, 126, 234, 0.15);
            color: #8b9aff;
        }

        body.dark-mode .nav-item.active {
            color: #8b9aff;
            border-bottom-color: #8b9aff;
            background: rgba(102, 126, 234, 0.2);
        }

        body.dark-mode .footer-content {
            background: rgba(30, 30, 46, 0.95);
        }

        body.dark-mode .footer-content p {
            color: #b0b0b0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px 60px;
            }

            .header {
                padding: 40px 30px 25px;
            }

            .header h1 {
                font-size: 36px;
            }

            .navbar {
                flex-direction: row;
            }

            .nav-item {
                padding: 14px 16px;
                font-size: 14px;
                flex-direction: column;
                gap: 4px;
            }

            .nav-text {
                font-size: 12px;
            }

            .gallery-container {
                padding: 25px 20px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .nav-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .prev-btn {
                left: 15px;
            }

            .next-btn {
                right: 15px;
            }

            .close-btn {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
                font-size: 24px;
            }

            .image-counter {
                bottom: 15px;
                font-size: 14px;
                padding: 10px 20px;
            }

            .footer-content {
                padding: 25px 30px;
            }
        }

        @media (max-width: 480px) {
            .header img {
                max-width: 150px;
            }

            .header h1 {
                font-size: 32px;
            }

            .nav-item {
                padding: 12px 10px;
            }

            .nav-text {
                display: none;
            }

            .nav-icon {
                font-size: 20px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo.png" alt="KaosKloth Logo">
            <h1>Galeri</h1>
            <p class="subtitle">Koleksi Produk KaosKloth</p>
        </div>

        <nav class="navbar">
            <a href="index.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Beranda</span>
            </a>
            <a href="tentang.html" class="nav-item">
                <span class="nav-icon">ℹ️</span>
                <span class="nav-text">Tentang</span>
            </a>
            <a href="galeri.html" class="nav-item active">
                <span class="nav-icon">🖼️</span>
                <span class="nav-text">Galeri</span>
            </a>
        </nav>

        <div class="gallery-container">
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>

    <!-- Fullscreen Overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <button class="close-btn" onclick="closeFullscreen()">×</button>
        <button class="nav-btn prev-btn" onclick="navigateImage(-1)">‹</button>
        <div class="fullscreen-content">
            <img id="fullscreenImg" src="" alt="Fullscreen Image">
        </div>
        <button class="nav-btn next-btn" onclick="navigateImage(1)">›</button>
        <div class="image-counter" id="imageCounter"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <!-- Dark/Light Mode Toggle -->
            <div class="theme-toggle" id="themeToggle">
                <div class="theme-toggle-btn active" id="lightBtn" title="Light Mode">☀️</div>
                <div class="theme-toggle-btn" id="darkBtn" title="Dark Mode">🌙</div>
            </div>
            <p>Made with ❤️ by KaosKloth</p>
            <div class="footer-divider"></div>
            <p>&copy; <span class="footer-year">2025</span> KaosKloth. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // ==========================================
        // EDIT DAFTAR GAMBAR DI SINI
        // ==========================================
        const images = [
            "produk/template.jpg",
            "produk/template.jpg",
            "produk/template.jpg",
            "produk/template.jpg",
            "produk/template.jpg",
        ];
        // ==========================================

        let currentIndex = 0;

        // Generate gallery grid
        function generateGallery() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '';

            images.forEach((imgSrc, index) => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.onclick = () => openFullscreen(index);

                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = `Produk ${index + 1}`;
                img.loading = 'lazy';

                galleryItem.appendChild(img);
                galleryGrid.appendChild(galleryItem);
            });
        }

        // Open fullscreen view
        function openFullscreen(index) {
            currentIndex = index;
            const overlay = document.getElementById('fullscreenOverlay');
            const img = document.getElementById('fullscreenImg');
            const counter = document.getElementById('imageCounter');

            img.src = images[currentIndex];
            counter.textContent = `${currentIndex + 1} / ${images.length}`;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close fullscreen view
        function closeFullscreen() {
            const overlay = document.getElementById('fullscreenOverlay');
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Navigate between images
        function navigateImage(direction) {
            currentIndex += direction;

            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            } else if (currentIndex >= images.length) {
                currentIndex = 0;
            }

            const img = document.getElementById('fullscreenImg');
            const counter = document.getElementById('imageCounter');

            img.src = images[currentIndex];
            counter.textContent = `${currentIndex + 1} / ${images.length}`;
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('fullscreenOverlay');
            if (!overlay.classList.contains('active')) return;

            if (e.key === 'Escape') {
                closeFullscreen();
            } else if (e.key === 'ArrowLeft') {
                navigateImage(-1);
            } else if (e.key === 'ArrowRight') {
                navigateImage(1);
            }
        });

        // Close on overlay click
        document.getElementById('fullscreenOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'fullscreenOverlay') {
                closeFullscreen();
            }
        });

        // Theme Toggle
        const lightBtn = document.getElementById('lightBtn');
        const darkBtn = document.getElementById('darkBtn');
        const body = document.body;

        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            lightBtn.classList.remove('active');
            darkBtn.classList.add('active');
        }

        lightBtn.addEventListener('click', () => {
            body.classList.remove('dark-mode');
            lightBtn.classList.add('active');
            darkBtn.classList.remove('active');
            localStorage.setItem('theme', 'light');
        });

        darkBtn.addEventListener('click', () => {
            body.classList.add('dark-mode');
            lightBtn.classList.remove('active');
            darkBtn.classList.add('active');
            localStorage.setItem('theme', 'dark');
        });

        // Update year
        document.querySelector('.footer-year').textContent = new Date().getFullYear();

        // Initialize gallery
        generateGallery();
    </script>
</body>
</html>
